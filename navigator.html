<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>MS NAVIGATOR — демо</title>
  <style>
    :root {
      --ink: #17324a;
      --ink-2: #456071;
      --paper: #f3f0e8;
      --surface: #fffdf8;
      --line: #dcd9cf;
      --sage: #6f8f7e;
      --sage-soft: #e4ece6;
      --clay: #c87552;
      --clay-soft: #f5e5dc;
      --blue-soft: #e5edf1;
      --danger: #a3534c;
      --shadow: 0 18px 50px rgba(28, 49, 63, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 86% 8%, rgba(200,117,82,.10), transparent 24rem),
        linear-gradient(115deg, rgba(111,143,126,.07), transparent 42%),
        var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { min-height: 100vh; }
    .topbar {
      height: 68px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(23,50,74,.12);
      background: rgba(243,240,232,.88);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 50px; height: 50px; border-radius: 12px;
      display: grid; place-items: center; overflow: hidden;
      background: transparent; border: 0;
      box-shadow: none;
    }
    .brand-mark img {
      width: 100%; height: 100%; display: block; object-fit: contain;
      transform: scale(1.65); transform-origin: center;
      mix-blend-mode: multiply;
    }
    .brand-name { font-weight: 820; letter-spacing: .04em; }
    .brand-sub { margin-top: 2px; color: var(--ink-2); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .mode-switch {
      display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,253,248,.72);
    }
    .mode-btn {
      padding: 7px 11px; border: 0; border-radius: 999px; background: transparent;
      color: var(--ink-2); cursor: pointer; font-size: 11px; font-weight: 800;
    }
    .mode-btn.active { color: #fff; background: var(--ink); }
    .demo-pill, .hotkey {
      padding: 8px 12px; border-radius: 999px; font-size: 11px;
      text-transform: uppercase; letter-spacing: .14em; font-weight: 800;
    }
    .demo-pill { background: var(--clay-soft); color: #8b482e; }
    .hotkey { color: var(--ink-2); border: 1px solid var(--line); background: rgba(255,253,248,.7); }
    .scenario-back { display: none; cursor: pointer; }
    .scenario-back.visible { display: inline-flex; }
    .objections-menu-trigger {
      display: none; align-items: center; gap: 8px; color: #fff; border-color: var(--ink);
      background: var(--ink); cursor: pointer;
    }
    body.has-scenario .objections-menu-trigger { display: inline-flex; }
    .objections-menu-trigger::before {
      content: ""; width: 14px; height: 10px;
      background: linear-gradient(to bottom, currentColor 0 2px, transparent 2px 4px, currentColor 4px 6px, transparent 6px 8px, currentColor 8px 10px);
    }
    .home {
      max-width: 980px;
      margin: 0 auto;
      padding: 60px 32px 56px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 10px;
      color: var(--clay); text-transform: uppercase; letter-spacing: .17em;
      font-size: 11px; font-weight: 850;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: currentColor; }
    h1 { margin: 18px 0 12px; max-width: 760px; font-size: clamp(38px, 5vw, 62px); line-height: 1; letter-spacing: -.05em; }
    .lead { max-width: 620px; margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.55; }
    .section-head { margin: 42px 0 16px; display: flex; align-items: end; justify-content: space-between; gap: 18px; }
    .section-head h2 { margin: 0; font-size: 22px; letter-spacing: -.025em; }
    .section-head p { margin: 0; color: var(--ink-2); font-size: 13px; }
    .scenario-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .scenario-card {
      min-height: 150px; padding: 22px; border: 1px solid rgba(23,50,74,.12);
      border-radius: 24px; background: rgba(255,253,248,.82); box-shadow: var(--shadow);
      text-align: left; cursor: pointer; position: relative; overflow: hidden;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .scenario-card:hover { transform: translateY(-4px); border-color: rgba(23,50,74,.25); box-shadow: 0 24px 60px rgba(28,49,63,.13); }
    .scenario-card::after {
      content: ""; width: 110px; height: 110px; border-radius: 50%;
      position: absolute; right: -34px; bottom: -38px; border: 18px solid var(--card-soft);
    }
    .card-no { color: var(--card-accent); font-size: 12px; letter-spacing: .16em; font-weight: 850; }
    .scenario-card h3 { margin: 30px 46px 0 0; max-width: 250px; font-size: 23px; line-height: 1.12; letter-spacing: -.035em; }
    .scenario-card p { display: none; }
    .card-bottom { position: absolute; right: 20px; bottom: 18px; display: flex; align-items: center; justify-content: flex-end; }
    .stage-count { display: none; }
    .arrow { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--card-soft); color: var(--card-accent); font-size: 18px; font-weight: 700; }
    .hint {
      margin-top: 28px; padding: 18px 20px; display: flex; align-items: center; gap: 14px;
      color: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; font-size: 13px;
      background: rgba(255,253,248,.5);
    }
    .hint-key { min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: var(--ink); background: #fff; border: 1px solid var(--line); font-weight: 750; }
    .script { min-height: calc(100vh - 68px); display: none; }
    .script.active { display: grid; grid-template-columns: 276px minmax(0,1fr); }
    .sidebar {
      padding: 24px 14px 28px; border-right: 1px solid var(--line);
      background: rgba(255,253,248,.68); min-height: calc(100vh - 68px);
      max-height: calc(100vh - 68px); position: sticky; top: 68px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-objections {
      display: grid; gap: 8px; min-height: 0; overflow-y: auto; padding-right: 4px;
      scrollbar-width: thin; scrollbar-color: rgba(23,50,74,.28) transparent;
    }
    .dialog-start {
      width: 100%; min-height: 52px; margin-bottom: 10px; padding: 13px 14px;
      border: 1px solid var(--ink); border-radius: 13px; background: var(--ink); color: #fff;
      text-align: left; cursor: pointer; font-size: 13px; line-height: 1.35; font-weight: 780;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .dialog-start:hover { transform: translateX(2px); box-shadow: 0 8px 18px rgba(23,50,74,.14); }
    .dialog-start.active { background: var(--sage); border-color: var(--sage); }
    .sidebar-caption {
      margin: 8px 4px 10px; color: var(--ink-2); font-size: 10px;
      text-transform: uppercase; letter-spacing: .13em; font-weight: 850;
    }
    .objection-link {
      width: 100%; min-height: 48px; padding: 12px 13px; border: 1px solid var(--line);
      border-radius: 13px; background: rgba(255,253,248,.86); color: var(--ink);
      text-align: left; cursor: pointer; font-size: 13px; line-height: 1.35; font-weight: 720;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .objection-link:hover { border-color: var(--clay); background: #fff9f5; transform: translateX(2px); }
    .objection-link.active { border-color: var(--clay); color: #8b482e; background: var(--clay-soft); }
    .meeting-button {
      display: none; width: 100%; min-height: 64px; margin-top: 12px; padding: 14px;
      border: 1px solid var(--clay); border-radius: 13px; background: var(--clay); color: #fff;
      text-align: left; cursor: pointer; font-size: 13px; line-height: 1.35; font-weight: 820;
      box-shadow: 0 8px 20px rgba(200,117,82,.18);
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .meeting-button.visible { display: block; }
    .meeting-button:hover { transform: translateX(2px); background: #b86644; }
    .meeting-button.active { background: var(--sage); border-color: var(--sage); }
    .script-main { padding: 28px 42px 48px; min-width: 0; }
    .script.meeting-motivation.active { display: block; }
    .meeting-motivation .sidebar { display: none; }
    .meeting-motivation .script-main { width: min(960px, 100%); margin: 0 auto; padding: 54px 42px 64px; }
    .meeting-motivation .script-head { margin-bottom: 22px; }
    .meeting-motivation .stage-label { color: var(--sage); }
    .meeting-motivation .stage-title {
      max-width: 880px; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -.05em;
    }
    .meeting-motivation .speech-card { padding: 36px 42px; }
    .meeting-motivation-copy { max-width: 780px; }
    .meeting-motivation-copy p {
      margin: 0 0 18px; color: var(--ink-2); font-size: 18px; line-height: 1.65; font-weight: 520;
    }
    .meeting-motivation-copy .meeting-lead { color: var(--ink); font-size: 23px; line-height: 1.5; font-weight: 720; }
    .meeting-motivation-copy h2 {
      margin: 34px 0 18px; color: var(--ink); font-size: 21px; line-height: 1.2; letter-spacing: -.02em;
      text-transform: uppercase;
    }
    .meeting-motivation-copy ul { margin: 0 0 24px; padding: 0; list-style: none; display: grid; gap: 11px; }
    .meeting-motivation-copy li {
      position: relative; padding: 12px 16px 12px 46px; border: 1px solid var(--line); border-radius: 13px;
      background: rgba(229,237,241,.55); color: var(--ink); font-size: 16px; line-height: 1.45; font-weight: 620;
    }
    .meeting-motivation-copy li::before {
      content: "✓"; position: absolute; left: 16px; top: 11px; color: var(--sage); font-size: 18px; font-weight: 900;
    }
    .meeting-motivation-copy blockquote {
      margin: 30px 0 0; padding: 22px 24px; border-left: 4px solid var(--clay); border-radius: 0 15px 15px 0;
      background: var(--clay-soft); color: var(--ink); font-size: 21px; line-height: 1.5; font-weight: 760;
    }
    .meeting-motivation .stage-action { justify-content: flex-start; margin-top: 4px; }
    .meeting-motivation .stage-target { min-width: 310px; min-height: 54px; }
    .script-head { max-width: 1160px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .stage-label { color: var(--clay); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 850; }
    .stage-title { margin: 7px 0 0; font-size: 28px; line-height: 1.15; letter-spacing: -.035em; }
    .workarea { max-width: 1160px; margin: 0 auto; display: grid; gap: 16px; }
    .goal {
      display: flex; gap: 13px; align-items: flex-start; padding: 16px 18px; border-radius: 15px;
      background: var(--blue-soft); color: var(--ink-2); font-size: 13px; line-height: 1.55;
    }
    .goal strong { color: var(--ink); }
    .goal-dot { width: 9px; height: 9px; margin-top: 5px; flex: 0 0 auto; border: 2px solid var(--ink); border-radius: 50%; }
    .speech-card { padding: 26px 30px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid rgba(23,50,74,.1); }
    .speech-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .speech-kicker { color: var(--sage); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 850; }
    .speech { margin: 20px 0 0; font-size: clamp(21px,2.2vw,29px); line-height: 1.4; letter-spacing: -.027em; font-weight: 590; }
    .speech p { margin: 0 0 18px; }
    .speech p:last-child { margin-bottom: 0; }
    .speech .client-answer, .exact-script-content .client-answer { color: #718096; font-style: italic; }
    .speaker-label {
      display: block; margin-bottom: 5px; color: var(--sage); font-size: 10px;
      line-height: 1.2; text-transform: uppercase; letter-spacing: .12em; font-weight: 850;
    }
    .client-line .speaker-label, .client-answer .speaker-label { color: #718096; }
    .manager-note .speaker-label, .flow-note .speaker-label { color: #9a6b13; }
    .speech .manager-note, .exact-script-content .manager-note {
      padding: 12px 16px; background: #fff6d8; border-left: 4px solid #f0b429;
      border-radius: 0 10px 10px 0; font-size: .72em; font-weight: 540;
    }
    .speech .closing-question, .exact-script-content .closing-question {
      margin-top: 24px; padding: 18px; background: #e9f7f9; border-radius: 10px;
    }
    .speech-card.flow-layout { padding: 18px 32px 30px; }
    .flow-layout .speech { margin-top: 8px; }
    .dialog-flow { display: grid; }
    .dialog-strip {
      padding: 28px 0; border-top: 1px solid var(--line);
    }
    .dialog-strip:first-child { border-top: 0; }
    .dialog-strip-head {
      display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 13px;
      align-items: center; margin-bottom: 18px;
    }
    .dialog-strip-number {
      width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%;
      color: #fff; background: var(--ink); font-size: 11px; font-weight: 850; letter-spacing: .04em;
    }
    .dialog-strip h3 {
      margin: 0; color: var(--ink-2); font-size: 12px; line-height: 1.3;
      text-transform: uppercase; letter-spacing: .12em;
    }
    .dialog-lines { display: grid; gap: 14px; }
    .dialog-lines > p, .branch-card p { margin: 0; }
    .dialog-line {
      padding: 0 2px; font-size: clamp(19px,1.8vw,24px); line-height: 1.48;
    }
    .client-line {
      padding: 11px 15px; border-left: 3px solid #aab4bb; border-radius: 0 10px 10px 0;
      color: #6f7f8b; background: #f3f5f5; font-size: clamp(16px,1.35vw,19px);
      font-style: italic;
    }
    .branch-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 3px; }
    .branch-card {
      padding: 17px 18px; border: 1px solid rgba(23,50,74,.12); border-radius: 15px;
      background: var(--blue-soft); font-size: clamp(16px,1.35vw,19px); line-height: 1.5;
    }
    .branch-card.yes { background: var(--sage-soft); border-color: rgba(111,143,126,.28); }
    .branch-card.no { background: var(--clay-soft); border-color: rgba(200,117,82,.28); }
    .branch-card.full { grid-column: 1 / -1; }
    .branch-label {
      display: block; margin-bottom: 9px; color: var(--ink-2); font-size: 10px;
      line-height: 1.2; text-transform: uppercase; letter-spacing: .13em; font-weight: 850;
    }
    .branch-card p + p { margin-top: 12px; }
    .branch-subpath {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(23,50,74,.12);
    }
    .branch-subpath .branch-label { margin-bottom: 8px; }
    .branch-subpath p + p { margin-top: 10px; }
    .flow-note {
      padding: 12px 16px; border-left: 4px solid #f0b429; border-radius: 0 10px 10px 0;
      background: #fff6d8; font-size: 14px; line-height: 1.45;
    }
    .closing-line {
      padding: 18px; border-radius: 14px; background: #e9f7f9;
    }
    .schedule-flow .dialog-strip-number { background: var(--clay); }
    .listen { margin-top: 20px; padding-top: 17px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 13px; line-height: 1.55; }
    .listen strong { color: var(--ink); }
    .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 4px; }
    .nav-btn { min-width: 120px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,253,248,.75); padding: 12px 16px; cursor: pointer; font-weight: 720; font-size: 13px; }
    .nav-btn.primary { color: #fff; background: var(--ink); border-color: var(--ink); }
    .nav-btn:disabled { opacity: .38; cursor: default; }
    .nav-status { color: var(--ink-2); font-size: 12px; }
    .stage-action { display: none; justify-content: flex-end; padding-top: 2px; }
    .stage-action.visible { display: flex; }
    .stage-target {
      min-width: 230px; color: #fff; background: var(--clay); border-color: var(--clay);
    }
    .stage-target:hover { background: #b86644; border-color: #b86644; }
    .objection-nav { display: none; justify-content: flex-start; }
    .objection-nav.visible { display: flex; }
    .objection-page { display: none; gap: 14px; }
    .objection-page.visible { display: grid; }
    .objection-copy {
      padding: 22px 30px; border-radius: 20px; background: var(--surface);
      box-shadow: var(--shadow); border: 1px solid rgba(23,50,74,.1);
    }
    .objection-copy-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .objection-copy-head span { color: var(--sage); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; font-weight: 850; }
    .objection-steps { display: grid; }
    .objection-step {
      display: grid; grid-template-columns: 176px minmax(0,1fr); gap: 28px;
      padding: 24px 0; border-top: 1px solid var(--line);
    }
    .objection-step:first-child { border-top: 0; }
    .step-meta { display: flex; align-items: flex-start; gap: 10px; color: var(--ink-2); font-size: 11px; line-height: 1.4; text-transform: uppercase; letter-spacing: .1em; font-weight: 820; }
    .step-number {
      width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center;
      border-radius: 50%; color: #fff; background: var(--clay); font-size: 10px; letter-spacing: 0;
    }
    .step-text { margin: 0; color: var(--ink); font-size: clamp(18px,1.55vw,22px); line-height: 1.5; letter-spacing: -.018em; font-weight: 560; }
    .exact-script-content { color: var(--ink); font-size: clamp(18px,1.55vw,22px); line-height: 1.55; letter-spacing: -.018em; font-weight: 540; }
    .exact-script-content p { margin: 0; padding: 18px 0; border-top: 1px solid var(--line); }
    .exact-script-content p:first-child { border-top: 0; }
    .objection-pager { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .pager-actions { display: flex; gap: 10px; }
    .objection-list-btn {
      color: #fff; background: var(--sage); border-color: var(--sage);
    }
    .objection-list-btn:hover { background: #5f7f70; border-color: #5f7f70; }
    .result-btn { margin-left: auto; }
    .objection-overlay {
      position: fixed; inset: 0; z-index: 100; display: none;
      background: rgba(18,39,56,.62); backdrop-filter: blur(10px);
    }
    .objection-overlay.visible { display: block; }
    body.overlay-open { overflow: hidden; }
    .objection-overlay-panel {
      min-height: 100%; padding: 30px clamp(22px,4vw,64px) 48px;
      background:
        radial-gradient(circle at 90% 4%, rgba(200,117,82,.12), transparent 26rem),
        linear-gradient(115deg, rgba(111,143,126,.08), transparent 45%),
        var(--paper);
      overflow-y: auto;
    }
    .objection-overlay-head {
      max-width: 1180px; margin: 0 auto 30px; display: flex;
      align-items: flex-start; justify-content: space-between; gap: 24px;
    }
    .objection-overlay-kicker {
      color: var(--clay); font-size: 11px; text-transform: uppercase;
      letter-spacing: .16em; font-weight: 850;
    }
    .objection-overlay-title {
      margin: 10px 0 0; font-size: clamp(32px,4vw,52px);
      line-height: 1; letter-spacing: -.045em;
    }
    .objection-overlay-close {
      width: 48px; height: 48px; flex: 0 0 auto; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 50%; color: var(--ink);
      background: var(--surface); cursor: pointer; font-size: 25px; line-height: 1;
      box-shadow: 0 10px 26px rgba(28,49,63,.08);
    }
    .objection-overlay-close:hover { color: #fff; border-color: var(--ink); background: var(--ink); }
    .objection-overlay-grid {
      max-width: 1180px; margin: 0 auto; display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px;
    }
    .objection-overlay-link {
      min-height: 108px; padding: 20px; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 18px; border: 1px solid rgba(23,50,74,.14);
      border-radius: 18px; color: var(--ink); background: rgba(255,253,248,.9);
      text-align: left; cursor: pointer; box-shadow: 0 12px 34px rgba(28,49,63,.06);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .objection-overlay-link:hover {
      transform: translateY(-2px); border-color: var(--clay);
      box-shadow: 0 18px 38px rgba(28,49,63,.11);
    }
    .objection-overlay-link.active { border-color: var(--clay); background: var(--clay-soft); }
    .objection-overlay-label { font-size: 17px; line-height: 1.3; font-weight: 780; }
    .objection-overlay-number {
      color: var(--clay); font-size: 11px; letter-spacing: .12em; font-weight: 850;
    }
    body.call-mode .training-only { display: none !important; }
    body.call-mode .speech-card { box-shadow: 0 10px 30px rgba(28,49,63,.07); }
    body.call-mode .exact-script-content p { padding: 15px 0; }
    body.call-mode .stage-label { color: var(--sage); }
    @media (max-width: 900px) {
      .scenario-grid { grid-template-columns: 1fr; }
      .scenario-card { min-height: 130px; }
      .script.active { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; max-height: 340px; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 20px; position: static; }
      .script-main { padding: 24px 20px 40px; }
      .meeting-motivation .script-main { padding: 38px 20px 48px; }
      .objection-step { grid-template-columns: 1fr; gap: 10px; padding: 20px 0; }
      .sidebar-caption, .sidebar-objections { display: none; }
      .objection-overlay-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 620px) {
      .topbar { height: 66px; padding: 0 16px; }
      .brand-sub, .demo-pill { display: none; }
      .top-actions { gap: 6px; }
      .hotkey { padding: 7px 9px; letter-spacing: .08em; }
      .mode-btn { padding: 6px 8px; font-size: 10px; }
      .home { padding: 46px 18px 40px; }
      h1 { font-size: 42px; }
      .lead { font-size: 16px; }
      .section-head { margin-top: 46px; align-items: start; flex-direction: column; }
      .script { min-height: calc(100vh - 66px); }
      .script-head { align-items: flex-start; }
      .stage-title { font-size: 23px; }
      .speech-card { padding: 22px; }
      .meeting-motivation .stage-title { font-size: 32px; }
      .meeting-motivation .speech-card { padding: 24px 20px; }
      .meeting-motivation-copy .meeting-lead { font-size: 20px; }
      .meeting-motivation-copy p { font-size: 16px; }
      .meeting-motivation-copy li { padding: 11px 13px 11px 42px; font-size: 15px; }
      .meeting-motivation-copy li::before { left: 14px; top: 10px; }
      .meeting-motivation-copy blockquote { padding: 18px 18px; font-size: 18px; }
      .meeting-motivation .stage-target { width: 100%; min-width: 0; }
      .speech-card.flow-layout { padding: 12px 20px 24px; }
      .speech { font-size: 21px; }
      .branch-grid { grid-template-columns: 1fr; }
      .branch-card.full { grid-column: auto; }
      .dialog-strip { padding: 23px 0; }
      .nav-status { display: none; }
      .objection-copy { padding: 20px; }
      .objection-pager { align-items: stretch; flex-direction: column; }
      .result-btn { margin-left: 0; }
      .pager-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .pager-actions .nav-btn { min-width: 0; }
      .objection-overlay-panel { padding: 22px 16px 32px; }
      .objection-overlay-head { margin-bottom: 22px; }
      .objection-overlay-grid { grid-template-columns: 1fr; gap: 10px; }
      .objection-overlay-link { min-height: 82px; padding: 17px; }
      .objection-overlay-label { font-size: 15px; }
      .objection-overlay-close { width: 42px; height: 42px; }
    }
  </style>
</head>

        ['Присоединение', 'Отлично. Значит, сам канал вы считаете важным и уже вкладываетесь в него.'],
        ['Уточняем', 'По каким показателям вы сейчас оцениваете подрядчика: позиции, доля трафика, переходы, звонки или только выполненные работы?'],
        ['Отрабатываем', 'Мы не предлагаем менять подрядчика вслепую. Сначала можно сравнить текущую динамику, подход и точки роста. После этого вы решите, есть ли вообще разница для бизнеса.'],
        ['Возвращаем в диалог', 'Давайте на короткой встрече предметно сравним вашу текущую ситуацию. Сегодня после 16:00 удобно?']
      ],
      'not-interested': [
        ['Присоединение', 'Принял. Спорить с вами не буду.'],
        ['Уточняем', 'Чтобы корректно зафиксировать: вам неинтересен сам канал Яндекс Карт или сейчас просто нет задачи усиливать поток клиентов?'],
        ['Отрабатываем', 'Я спрашиваю потому, что это две разные ситуации. Если канал не работает для вашей категории — завершим. Если задача отложена, достаточно понять причину и не возвращаться с неуместным предложением.'],
        ['Возвращаем в диалог', 'Что точнее описывает вашу ситуацию сейчас?']
      ],
      'fine': [
        ['Присоединение', 'Это хорошо. Значит, бизнес уже получает результат и нет задачи срочно что-то спасать.'],
        ['Уточняем', 'А “всё хорошо” вы оцениваете по загрузке бизнеса или видите конкретные позиции и долю трафика относительно конкурентов?'],
        ['Отрабатываем', 'Даже при хорошей загрузке полезно понимать, за счёт чего приходит спрос и не начали ли конкуренты забирать видимость. Речь не о проблеме, а о контроле сильной позиции.'],
        ['Возвращаем в диалог', 'Хотите за пятнадцать минут увидеть объективное сравнение вашей карточки с ближайшими конкурентами?']
      ],
      'send-leader': [
        ['Присоединение', 'Да, предложение направлю.'],
        ['Уточняем', 'Что для вас важнее увидеть в нём: состав работ, прогнозируемую динамику или стоимость?'],
        ['Отрабатываем', 'Общая презентация не покажет, что именно происходит с вашей карточкой. Сначала нужно увидеть исходную точку и задать два вопроса, а после встречи направить уже предметное решение.'],
        ['Возвращаем в диалог', 'Выделим пятнадцать минут сегодня после 16:00 или завтра до обеда?']
      ],
      'think': [
        ['Присоединение', 'Конечно. Решение действительно нужно оценить спокойно.'],
        ['Уточняем', 'Что именно вы хотите для себя обдумать: актуальность задачи, формат работы, доверие к результату или возможный бюджет?'],
        ['Отрабатываем', 'Если оставить формулировку общей, нам будет непонятно, какой информации вам не хватило. Давайте сейчас найдём один конкретный вопрос и разберём его без давления.'],
        ['Возвращаем в диалог', 'Какой главный вопрос мешает вам сказать “да” прямо сейчас?']
      ],
      'price-first': [
        ['Присоединение', 'Стоимость обязательно назову на этой встрече. Скрывать её до конца разговора не буду.'],
        ['Уточняем', 'Вам важно сразу понять порядок бюджета или вы уже сравниваете нас с конкретным предложением?'],
        ['Отрабатываем', 'Цена зависит от исходной ситуации, объёма и срока. Если назвать случайную цифру до диагностики, она ничего не скажет ни о решении, ни о результате.'],
        ['Возвращаем в диалог', 'Дайте мне десять минут на вопросы, после этого покажу подходящий вариант и точную стоимость. Подходит?']
      ],
      'bad-experience': [
        ['Присоединение', 'Понимаю, после неудачного опыта доверие к новому подрядчику всегда ниже.'],
        ['Уточняем', 'Что именно не сработало: не было динамики, подрядчик ничего не показывал или вы ожидали больше обращений?'],
        ['Отрабатываем', 'Нам важно не убеждать вас общими обещаниями, а отделить ошибку прошлого подхода от возможностей самого канала. Поэтому начинаем с исходной точки и заранее фиксируем, что именно оцениваем.'],
        ['Возвращаем в диалог', 'Если мы покажем прозрачную систему контроля, это снимет ваше главное опасение?']
      ],
      'guarantee': [
        ['Присоединение', 'Понимаю, вам нужна предсказуемость, а не оплата процесса ради процесса.'],
        ['Уточняем', 'Что именно для вас означает гарантия: конкретное место, рост показателей или понятный объём выполненной работы?'],
        ['Отрабатываем', 'Точную позицию гарантировать нельзя: выдача меняется и зависит от множества факторов. Мы фиксируем исходную точку, гарантируем системный объём работ и регулярно показываем измеримую динамику.'],
        ['Возвращаем в диалог', 'Если контроль будет прозрачным, по каким двум показателям вы хотите оценивать результат в первую очередь?']
      ],
      'expensive': [
        ['Присоединение', 'Согласен, это заметная инвестиция, и её нужно обосновать.'],
        ['Уточняем', 'Дорого относительно вашего бюджета, другого предложения или ценности результата, которую вы пока не увидели?'],
        ['Отрабатываем', 'Если вопрос в бюджете — обсудим допустимый формат. Если в ценности — вернёмся к задаче и посчитаем, что бизнес получает при росте видимости. Снижать цену, не понимая причины, неправильно.'],
        ['Возвращаем в диалог', 'Какой из трёх вариантов ближе к вашей ситуации?']
      ],
      'meeting-think': [
        ['Присоединение', 'Хорошо. Давить на решение не буду.'],
        ['Уточняем', 'Над чем конкретно хотите подумать: над задачей, доверием к нам, сроком запуска или бюджетом?'],
        ['Отрабатываем', 'Обычно за общей паузой остаётся один нерешённый вопрос. Если назовём его сейчас, вы получите недостающую информацию и сможете принять решение на фактах.'],
        ['Возвращаем в диалог', 'Какой один вопрос нужно закрыть, чтобы вы могли двигаться дальше?']
      ],
      'consult': [
        ['Присоединение', 'Да, если решение совместное, мнение второго участника нужно учитывать.'],
        ['Уточняем', 'С кем вы советуетесь и что для этого человека будет главным критерием: результат, бюджет или надёжность подрядчика?'],
        ['Отрабатываем', 'Пересказ встречи обычно теряет важные детали. Лучше сразу подключить второго участника и ответить на его вопросы напрямую.'],
        ['Возвращаем в диалог', 'Когда удобно провести короткий общий созвон втроём: завтра утром или после обеда?']
      ],
      'budget': [
        ['Присоединение', 'Понял. Если денег действительно нет, продавливание решения ничего не даст.'],
        ['Уточняем', 'Бюджет уже распределён на другие задачи или продвижение пока не стало достаточным приоритетом?'],
        ['Отрабатываем', 'Если бюджет распределён, зафиксируем реальный срок возврата. Если вопрос в приоритете, нужно сравнить стоимость решения с тем спросом, который сейчас забирают конкуренты.'],
        ['Возвращаем в диалог', 'Когда бюджет может появиться и что должно произойти, чтобы эта задача вошла в приоритет?']
      ]
    };

    let activeScenario = null;
    let activeStage = 0;
    let activeObjection = null;
    let returnStage = 0;
    let appMode = 'call';
    const $ = (id) => document.getElementById(id);

    const sidebarLabels = {
      'admin-forbidden':'Номер не даём',
      'admin-offer':'Повторный запрет — оферта',
      'admin-callback':'Он вам перезвонит',
      'admin-email':'Отправьте на почту',
      'admin-not-interested':'Неинтересно',
      'admin-responsible':'Я этим занимаюсь',
      'admin-no-changes':'Ничего не поменялось',
      'admin-allies':'Повторный запрет — союзники',
      'not-interested':'Неинтересно',
      'no-time':'Нет времени / занят',
      'yandex-not-working':'Яндекс не работает',
      'price':'Сколько стоит?',
      'negative-experience':'Негативный опыт',
      'send-email':'Отправьте на почту',
      'callback':'Перезвоните позже',
      'marketer':'Есть маркетолог',
      'other-traffic':'Трафик из других каналов',
      'what-changes':'Что за изменения?'
    };

    function resetScroll() {
      requestAnimationFrame(() => {
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        const main = document.querySelector('.script-main');
        if (main) main.scrollTop = 0;
      });
    }

    function showObjectionList() {
      if (!activeScenario) return;
      $('objectionOverlayKicker').textContent = activeScenario.title;
      $('objectionOverlayTitle').textContent = 'Выберите возражение';
      $('objectionOverlayGrid').innerHTML = activeScenario.objections.map((o, index) => `
        <button class="objection-overlay-link ${o.id===activeObjection?.id?'active':''}" data-overlay-objection="${o.id}">
          <span class="objection-overlay-label">${sidebarLabels[o.id] || o.title}</span>
          <span class="objection-overlay-number">${String(index + 1).padStart(2, '0')}</span>
        </button>`).join('');
      document.querySelectorAll('[data-overlay-objection]').forEach(btn => btn.addEventListener('click', () => {
        closeObjectionList();
        openObjection(btn.dataset.overlayObjection);
      }));
      $('objectionOverlay').classList.add('visible');
      $('objectionOverlay').setAttribute('aria-hidden', 'false');
      document.body.classList.add('overlay-open');
      requestAnimationFrame(() => $('objectionOverlayClose').focus({ preventScroll: true }));
    }

    function closeObjectionList() {
      $('objectionOverlay').classList.remove('visible');
      $('objectionOverlay').setAttribute('aria-hidden', 'true');
      document.body.classList.remove('overlay-open');
    }

    function setMode(mode) {
      appMode = mode;
      document.body.classList.toggle('call-mode', mode === 'call');
      document.body.classList.toggle('training-mode', mode === 'training');
      $('callMode').classList.toggle('active', mode === 'call');
      $('trainingMode').classList.toggle('active', mode === 'training');
      if (activeScenario) renderScriptHeader();
    }

    function renderScriptHeader() {
      if (!activeScenario) return;
      if (activeScenario.id === 'meeting') {
        $('stageLabel').textContent = 'Твой следующий уровень';
        return;
      }
      $('stageLabel').textContent = appMode === 'training'
        ? (activeObjection ? 'Возражение' : `Этап ${activeStage + 1} из ${activeScenario.stages.length}`)
        : activeScenario.title;
    }

    function renderHome() {
      $('scenarioGrid').innerHTML = data.map(s => `
        <button class="scenario-card" data-scenario="${s.id}" style="--card-accent:${s.accent};--card-soft:${s.soft}">
          <span class="card-no">${s.number}</span><h3>${s.title}</h3>
          <span class="card-bottom"><span class="arrow">→</span></span>
        </button>`).join('');
      document.querySelectorAll('[data-scenario]').forEach(btn => btn.addEventListener('click', () => openScenario(btn.dataset.scenario)));
    }

    function openScenario(id, stage = 0) {
      activeScenario = data.find(s => s.id === id);
      activeStage = Math.max(0, Math.min(stage, activeScenario.stages.length - 1));
      activeObjection = null;
      returnStage = activeStage;
      $('home').style.display = 'none';
      $('script').classList.add('active');
      $('script').classList.toggle('meeting-motivation', activeScenario.id === 'meeting');
      $('backHome').classList.add('visible');
      document.body.classList.add('has-scenario');
      renderSidebarObjections();
      renderScript();
      resetScroll();
    }

    function renderScript() {
      const s = activeScenario;
      const stage = s.stages[activeStage];
      activeObjection = null;
      renderScriptHeader();
      $('stageTitle').textContent = stage.title;
      $('goalLabel').textContent = 'Цель этапа: ';
      $('stageGoal').textContent = stage.goal;
      $('speechKicker').textContent = s.id === 'meeting' ? '' : 'Говорим клиенту';
      $('speech').innerHTML = stage.speech;
      $('stageCard').classList.toggle('flow-layout', s.id === 'leader' || s.id === 'admin');
      $('listen').textContent = stage.listen;
      $('stageGoal').closest('.goal').style.display = s.id === 'meeting' ? 'none' : '';
      $('speechKicker').closest('.speech-top').style.display = s.id === 'meeting' ? 'none' : '';
      $('listenBlock').style.display = s.id === 'meeting' ? 'none' : '';
      $('stageCard').style.display = '';
      const showStageAction = (s.id === 'admin' && activeStage === 0) || s.id === 'leader' || s.id === 'meeting';
      $('stageAction').classList.toggle('visible', showStageAction);
      $('stageTarget').textContent = s.id === 'meeting'
        ? 'Хочу получить допуск к встречам →'
        : s.id === 'admin'
          ? 'Перейти к звонку руководителю →'
          : activeStage === s.stages.length - 1
            ? 'Встреча назначена → Вернуться к сценариям'
            : 'Перейти к выбору времени →';
      $('objectionPage').classList.remove('visible');
      $('stageNav').style.display = 'none';
      $('prevStage').disabled = activeStage === 0;
      $('nextStage').disabled = false;
      $('nextStage').textContent = activeStage === s.stages.length - 1
        ? 'Завершить встречу →'
        : 'Дальше →';
      $('navStatus').textContent = `${activeStage + 1} / ${s.stages.length}`;
      $('dialogStart').classList.toggle('active', activeStage === 0);
      $('meetingButton').classList.toggle('visible', s.id === 'leader' || s.id === 'admin');
      $('meetingButton').classList.toggle('active', s.id === 'leader' && activeStage === 1);
      renderSidebarObjections();
      resetScroll();
    }

    function renderSidebarObjections() {
      $('sidebarObjections').innerHTML = activeScenario.objections.map(o => `
        <button class="objection-link ${o.id===activeObjection?.id?'active':''}" data-objection="${o.id}">${sidebarLabels[o.id] || o.title}</button>`).join('');
      document.querySelectorAll('[data-objection]').forEach(btn => btn.addEventListener('click', () => openObjection(btn.dataset.objection)));
      if (activeScenario.id === 'admin') {
        $('meetingButton').innerHTML = 'Результат звонка<br>Перейти к владельцу →';
      } else {
        $('meetingButton').innerHTML = 'Завершение звонка<br>Выбор времени →';
      }
      $('meetingButton').classList.toggle('visible', activeScenario.id === 'leader' || activeScenario.id === 'admin');
      $('meetingButton').classList.toggle('active', activeScenario.id === 'leader' && !activeObjection && activeStage === 1);
    }

    function openObjection(id) {
      const objection = activeScenario.objections.find(o => o.id === id);
      if (!objection) return;
      if (!activeObjection) returnStage = activeStage;
      activeObjection = objection;
      const details = objectionDetails[objection.id] || [
        ['Присоединение', 'Понимаю вашу позицию. Давайте коротко уточню, что именно за ней стоит.'],
        ['Уточняем', objection.goal],
        ['Отрабатываем', objection.text],
        ['Возвращаем в диалог', 'Подскажите, что для вас сейчас будет правильным следующим шагом?']
      ];
      const objectionIndex = activeScenario.objections.findIndex(o => o.id === id);
      renderScriptHeader();
      $('stageTitle').textContent = objection.title;
      $('goalLabel').textContent = 'Задача: ';
      $('stageGoal').textContent = objection.goal;
      $('stageCard').style.display = 'none';
      $('stageAction').classList.remove('visible');
      $('stageNav').style.display = 'none';
      $('objectionSteps').innerHTML = objection.html
        ? `<div class="exact-script-content">${objection.html}</div>`
        : details.map((part, index) => `
          <div class="objection-step">
            <div class="step-meta"><span class="step-number">${index + 1}</span><span>${part[0]}</span></div>
            <p class="step-text">${part[1]}</p>
          </div>`).join('');
      $('objectionPage').classList.add('visible');
      $('objectionStatus').textContent = `${objectionIndex + 1} / ${activeScenario.objections.length}`;
      $('prevObjection').disabled = objectionIndex === 0;
      $('nextObjection').disabled = objectionIndex === activeScenario.objections.length - 1;
      $('prevObjection').dataset.index = objectionIndex - 1;
      $('nextObjection').dataset.index = objectionIndex + 1;
      $('dialogStart').classList.remove('active');
      $('meetingButton').classList.remove('active');
      $('objectionTarget').textContent = activeScenario.id === 'admin'
        ? 'Перейти к владельцу →'
        : activeScenario.id === 'leader'
          ? 'Перейти к выбору времени →'
          : 'Вернуться ко встрече →';
      $('backToDialog').style.display = activeScenario.id === 'meeting' ? 'none' : '';
      renderSidebarObjections();
      resetScroll();
    }
    function goHome() {
      closeObjectionList();
      $('script').classList.remove('active');
      $('script').classList.remove('meeting-motivation');
      $('home').style.display = 'block';
      $('backHome').classList.remove('visible');
      document.body.classList.remove('has-scenario');
      activeScenario = null;
      resetScroll();
    }
    $('backHome').addEventListener('click', goHome);
    $('prevStage').addEventListener('click', () => { if(activeStage>0){activeStage--;renderScript();resetScroll();} });
    $('nextStage').addEventListener('click', () => {
      if(activeStage < activeScenario.stages.length - 1) {
        activeStage++;
        renderScript();
        resetScroll();
      } else if(activeScenario?.id === 'meeting') {
        goHome();
      }
    });
    $('dialogStart').addEventListener('click', () => { activeStage = 0; renderScript(); resetScroll(); });
    $('stageTarget').addEventListener('click', () => {
      if (activeScenario?.id === 'meeting') {
        goHome();
      } else if (activeScenario?.id === 'admin') {
        openScenario('leader', 0);
      } else if (activeScenario?.id === 'leader' && activeStage === 0) {
        activeStage = 1;
        renderScript();
        resetScroll();
      } else if (activeScenario?.id === 'leader') {
        goHome();
      }
    });
    $('meetingButton').addEventListener('click', () => {
      if(activeScenario?.id === 'leader'){
        activeStage = 1;
        renderScript();
        resetScroll();
      } else if(activeScenario?.id === 'admin'){
        openScenario('leader', 0);
      }
    });
    $('backToDialog').addEventListener('click', () => { activeStage = returnStage; renderScript(); resetScroll(); });
    $('showObjectionList').addEventListener('click', showObjectionList);
    $('objectionMenuTrigger').addEventListener('click', showObjectionList);
    $('objectionOverlayClose').addEventListener('click', closeObjectionList);
    $('objectionOverlay').addEventListener('click', event => {
      if (event.target === $('objectionOverlay')) closeObjectionList();
    });
    $('objectionTarget').addEventListener('click', () => {
      if(activeScenario?.id === 'admin') {
        openScenario('leader', 0);
      } else if(activeScenario?.id === 'leader') {
        activeStage = 1;
        renderScript();
        resetScroll();
      } else {
        activeStage = returnStage;
        renderScript();
        resetScroll();
      }
    });
    $('prevObjection').addEventListener('click', () => { const i=Number($('prevObjection').dataset.index); if(i>=0) openObjection(activeScenario.objections[i].id); });
    $('nextObjection').addEventListener('click', () => { const i=Number($('nextObjection').dataset.index); if(i<activeScenario.objections.length) openObjection(activeScenario.objections[i].id); });
    $('callMode').addEventListener('click', () => setMode('call'));
    $('trainingMode').addEventListener('click', () => setMode('training'));
    ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(eventName => {
      document.addEventListener(eventName, event => event.preventDefault());
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && $('objectionOverlay').classList.contains('visible')) {
        closeObjectionList();
        $('objectionMenuTrigger').focus({ preventScroll: true });
      }
      const blockedShortcut = (event.ctrlKey || event.metaKey) && ['c', 'x', 'a', 's', 'u', 'p'].includes(event.key.toLowerCase());
      if (blockedShortcut) event.preventDefault();
    });
    setMode('call');
    renderHome();
  </script>
</body>
</html>
